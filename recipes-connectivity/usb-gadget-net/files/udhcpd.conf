# busybox udhcpd config for the USB network gadget.
# Exactly one lease, no router and no DNS, so the host keeps its own
# default route and resolver (same as Skynode).

start       10.41.1.2
end         10.41.1.2
max_leases  1
interface   usbc

lease_file  /run/usb-gadget-net/udhcpd.leases
pidfile     /run/usb-gadget-net/udhcpd.pid

option  subnet  255.255.255.0
option  lease   3600
